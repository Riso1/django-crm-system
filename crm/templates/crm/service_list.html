<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Услуги</title>
</head>
<body>
    <h1>Услуги</h1>

    <p>
        <a href="{% url 'crm:service_create' %}">Создать услугу</a>
    </p>

    {% if services %}
        <ul>
            {% for service in services %}
                <li>
                    <a href="{% url 'crm:service_detail' service.pk %}">
                        {{ service.name }}
                    </a>
                    — {{ service.price }} ₽
                    <a href="{% url 'crm:service_update' service.pk %}">Редактировать</a>
                    <a href="{% url 'crm:service_delete' service.pk %}">Удалить</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Услуг пока нет.</p>
    {% endif %}
</body>
</html>
