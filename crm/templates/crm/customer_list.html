<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Активные клиенты</title>
</head>
<body>

<h1>Активные клиенты</h1>

{% if customers %}
    <ul>
        {% for customer in customers %}
            <li>
                <a href="{% url 'crm:customer_detail' customer.pk %}">
                    {{ customer.lead.full_name }}
                </a>
                — {{ customer.contract }}

                <a href="{% url 'crm:customer_update' customer.pk %}">Редактировать</a>
                <a href="{% url 'crm:customer_delete' customer.pk %}">Удалить</a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>Активных клиентов пока нет.</p>
{% endif %}

<p>
    <a href="{% url 'crm:lead_list' %}">К потенциальным клиентам</a>
</p>

</body>
</html>
