<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ service.name }}</title>
</head>
<body>

<h1>{{ service.name }}</h1>

<p>
    <strong>Описание:</strong>
</p>

<p>
    {{ service.description }}
</p>

<p>
    <strong>Стоимость:</strong>
    {{ service.price }} ₽
</p>

<p>
    <a href="{% url 'crm:service_update' service.pk %}">
        Редактировать
    </a>
</p>

<p>
    <a href="{% url 'crm:service_delete' service.pk %}">
        Удалить
    </a>
</p>

<p>
    <a href="{% url 'crm:service_list' %}">
        Назад
    </a>
</p>

</body>
</html>
